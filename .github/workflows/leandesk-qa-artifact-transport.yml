name: LeanDesk exact QA handoff transport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-exact-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact handoff from protected short-lived URL
        env:
          HANDOFF_URL: ${{ secrets.LEANDESK_QA_ASSET_URL_TMP }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HANDOFF_URL:-}"
          mkdir -p qa-artifact
          curl --fail --silent --show-error --location --retry 2 \
            --output qa-artifact/LeanDesk_Suite_0.8.1_Final_Windows_Engineering_QA_Handoff.zip \
            "$HANDOFF_URL"

      - name: Verify exact size SHA-256 and ZIP CRC integrity
        shell: bash
        run: |
          set -euo pipefail
          file='qa-artifact/LeanDesk_Suite_0.8.1_Final_Windows_Engineering_QA_Handoff.zip'
          test -f "$file"
          test "$(stat -c '%s' "$file")" = '262904538'
          printf '%s  %s\n' \
            '223ebd5d2513d5624c59b2336c5dee6f2457cac568ce2b78d1f185767ca00889' \
            "$file" | sha256sum --check --strict
          python3 - <<'PY'
          import sys
          import zipfile
          path = 'qa-artifact/LeanDesk_Suite_0.8.1_Final_Windows_Engineering_QA_Handoff.zip'
          try:
              with zipfile.ZipFile(path, 'r') as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise RuntimeError(f'CRC failure: {bad}')
                  print(f'ZIP_INTEGRITY|PASS|ENTRIES={len(archive.infolist())}')
          except Exception as exc:
              print(f'ZIP_INTEGRITY|FAIL|{exc}', file=sys.stderr)
              raise
          PY

      - name: Upload exact unchanged handoff for Independent QA
        uses: actions/upload-artifact@v4
        with:
          name: LeanDesk-0.8.1-Final-Windows-QA-Handoff-223EBD5D
          path: qa-artifact/LeanDesk_Suite_0.8.1_Final_Windows_Engineering_QA_Handoff.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
